<script>
//ENGINE ===== Motore di trascrizione: prima le combinazioni, poi le lettere singole =====
const V='αεηιουω',VL='κξπστφχψθ';
const SG={α:'a',β:'v',γ:'g',δ:'dh',ε:'e',ζ:'z',η:'i',θ:'th',ι:'i',κ:'k',λ:'l',μ:'m',ν:'n',ξ:'x',ο:'o',π:'p',ρ:'r',σ:'s',τ:'t',υ:'i',φ:'f',χ:'ch',ψ:'ps',ω:'o'};
const SR={β:'β = v',δ:'δ = dh',θ:'θ = th',χ:'χ = ch',ξ:'ξ = x',ψ:'ψ = ps',η:'η = i',υ:'υ = i',ω:'ω = o'};
const AC={a:'à',e:'è',i:'ì',o:'ò',u:'ù'};
const GFRONT='g'; // resa di γ davanti a vocale palatale (convenzione: sempre g)
function parse(w){ // lettere con flag accento (a) e dieresi (d)
 return [...w.toLowerCase().replace(/ς/g,'σ').normalize('NFD')].reduce((r,ch)=>{
  if(ch==='\u0301'){if(r.length)r[r.length-1].a=1}
  else if(ch==='\u0308'){if(r.length)r[r.length-1].d=1}
  else if(/[α-ω]/.test(ch))r.push({c:ch,a:0,d:0});
  return r},[]);
}
function tr(w){
 const L=parse(w),T=[],n=L.length,nx=k=>L[k]?L[k].c:'';let i=0;
 while(i<n){
  const x=L[i],y=L[i+1],c=x.c,d=y?y.c:'',ini=i===0,p=c+d;
  // 1) dittonghi vocalici (nessun accento/dieresi sulla prima lettera, nessuna dieresi sulla seconda)
  if(y&&!x.a&&!x.d&&!y.d&&V.includes(c)){
   const M={αι:'e',ει:'i',οι:'i',υι:'i',ου:'u'};
   if(M[p]){T.push({g:p,l:M[p],s:y.a,k:p,r:p+' = '+M[p]});i+=2;continue}
   if(p==='αυ'||p==='ευ'){
    const k=nx(i+2),f=!k||VL.includes(k),l=(c==='α'?'a':'e')+(f?'f':'v');
    T.push({g:p,l,s:y.a,k:p,r:`${p} = ${l}: davanti a ${k?(f?'consonante sorda':'vocale o consonante sonora')+' ('+k+')':'fine parola'} si pronuncia ${f?'f':'v'}`});i+=2;continue}
  }
  // 2) combinazioni consonantiche
  let o=null;
  if(p==='μπ')o=ini?['b','μπ a inizio parola = b']:['mb','μπ all’interno = mb'];
  else if(p==='ντ')o=ini?['d','ντ a inizio parola = d']:['nd','ντ all’interno = nd'];
  else if(p==='γκ')o=ini?['g','γκ a inizio parola = g']:['ng','γκ all’interno = ng'];
  else if(p==='γγ')o=['ng','γγ = ng'];
  else if(p==='τσ')o=['ts','τσ = ts'];
  else if(p==='τζ')o=['dz','τζ = dz'];
  if(o){T.push({g:p,l:o[0],s:0,k:p,r:o[1]});i+=2;continue}
  if(y&&c===d&&!V.includes(c)){T.push({g:p,l:SG[c],s:0,k:'doppia',r:p+': consonante doppia = suono singolo ('+SG[c]+')'});i+=2;continue}
  // 3) lettera singola
  let l=SG[c],k=SR[c]?c:null,r=SR[c]||null;
  if(c==='γ'&&y&&('εηιυ'.includes(d)||('αο'.includes(d)&&nx(i+2)==='ι'&&!y.a&&!L[i+2].d))){l=GFRONT;k='γ+palatale';r='γ davanti a vocale palatale: pronuncia palatale, resa con g'}
  T.push({g:c,l,s:V.includes(c)?x.a:0,k,r});i++;
 }
 const out=a=>T.map(t=>a&&t.s?t.l.replace(/[aeiou]/,m=>AC[m]):t.l).join('');
 return{a:out(1),p:out(0),T};
}
function trs(s){ // parola o frase
 const W=s.split(/\s+/).map(tr).filter(r=>r.T.length);
 return{a:W.map(r=>r.a).join(' '),p:W.map(r=>r.p).join(' '),T:W.reduce((q,r,j)=>q.concat(j?[{g:' ',l:' '}]:[],r.T),[])};
}
const ua=s=>s.replace(/[àèìòù]/g,m=>'aeiou'['àèìòù'.indexOf(m)]);
const nz=s=>s.toLowerCase().replace(/[^a-zàèìòù ]/g,' ').replace(/\s+/g,' ').trim();
const same=(v,R)=>{const u=nz(v);return u===(/[àèìòù]/.test(u)?nz(R.a):R.p)};
function diff(v,R){let s=ua(nz(v));for(const t of R.T){if(s.startsWith(t.l))s=s.slice(t.l.length);else return t}return null}
///ENGINE

"κουζίνα μπάνιο υπνοδωμάτιο σαλόνι κήπος μπαλκόνι ταβάνι πάτωμα τοίχος σκάλα ασανσέρ κλειδί κλειδαριά κουτί μπουκάλι ποτήρι πιάτο μπολ κουτάλι πιρούνι μαχαίρι κατσαρόλα τηγάνι φούρνος ψυγείο ντουλάπι κρεβάτι μαξιλάρι κουβέρτα καναπές χαλί λάμπα καθρέφτης",

"βουνό ποτάμι λίμνη δάσος δέντρο φύλλο κλαδί ρίζα γρασίδι πέτρα άμμος σύννεφο βροχή χιόνι άνεμος καταιγίδα αστέρι ουρανός γη φωτιά αέρας νερό νησί παραλία λιμάνι πλοίο αεροπλάνο τρένο λεωφορείο ποδήλατο μοτοσικλέτα ταξί δρόμος γέφυρα πλατεία χωριό πόλη χώρα σταθμός αεροδρόμιο ξενοδοχείο κατάστημα αγορά πάρκο",

"αριστερά δεξιά μπροστά πίσω πάνω κάτω μέσα έξω κοντά μακριά πάντα ποτέ συχνά σπάνια μαζί μόνος επίσης όμως επειδή όταν ενώ πριν μετά τώρα χθες αύριο πρωί μεσημέρι απόγευμα βράδυ νύχτα εβδομάδα μήνας χρόνος δευτερόλεπτο λεπτό ώρα άνοιξη καλοκαίρι φθινόπωρο χειμώνας Δευτέρα Τρίτη Τετάρτη Πέμπτη Παρασκευή Σάββατο Κυριακή ένας δύο τρία τέσσερα έξι επτά οκτώ εννέα δέκα εκατό χίλια"
