<script>
//ENGINE ===== Motore di trascrizione: prima le combinazioni, poi le lettere singole =====
const V='αεηιουω',VL='κξπστφχψθ';
const SG={α:'a',β:'v',γ:'g',δ:'dh',ε:'e',ζ:'z',η:'i',θ:'th',ι:'i',κ:'k',λ:'l',μ:'m',ν:'n',ξ:'x',ο:'o',π:'p',ρ:'r',σ:'s',τ:'t',υ:'i',φ:'f',χ:'ch',ψ:'ps',ω:'o'};
const SR={β:'β = v',δ:'δ = dh',θ:'θ = th',χ:'χ = ch',ξ:'ξ = x',ψ:'ψ = ps',η:'η = i',υ:'υ = i',ω:'ω = o'};
const AX='àèìòù',AC={a:AX[0],e:AX[1],i:AX[2],o:AX[3],u:AX[4]}; // accento nella trascrizione: per l'acuto metti AX='áéíóú'
const GFRONT='g'; // resa di γ davanti a vocale palatale (convenzione: sempre g)
const SI={α:'a',β:'v',γ:'ɣ',δ:'ð',ε:'e',ζ:'z',η:'i',θ:'θ',ι:'i',κ:'k',λ:'l',μ:'m',ν:'n',ξ:'ks',ο:'o',π:'p',ρ:'ɾ',σ:'s',τ:'t',υ:'i',φ:'f',χ:'x',ψ:'ps',ω:'o'}; // IPA fonemico
const PAL={γ:'ʝ',κ:'c',χ:'ç'}; // varianti palatali davanti a vocale anteriore
const ONS=new Set('κ π τ μ ν σ λ ρ δ β φ θ ζ γ χ ψ ξ μπ ντ γκ τσ τζ στ σπ σκ πρ τρ κρ βρ φρ δρ γρ θρ χρ πλ κλ βλ γλ φλ χλ σβ σγ σφ σχ σθ σμ σν πτ κτ φτ χτ φθ χθ γδ κν πν μν τμ στρ σπρ σκρ σπλ σκλ'.split(' ')); // attacchi sillabici ammessi
function parse(w){ // lettere con flag accento (a) e dieresi (d)
 return [...w.toLowerCase().replace(/ς/g,'σ').normalize('NFD')].reduce((r,ch)=>{
  if(ch==='\u0301'){if(r.length)r[r.length-1].a=1}
  else if(ch==='\u0308'){if(r.length)r[r.length-1].d=1}
  else if(/[α-ω]/.test(ch))r.push({c:ch,a:0,d:0});
  return r},[]);
}
function tr(w){
 const L=parse(w),T=[],n=L.length,nx=k=>L[k]?L[k].c:'';let i=0;
 const fr=(y,i)=>!!y&&('εηιυ'.includes(y.c)||('αο'.includes(y.c)&&nx(i+2)==='ι'&&!y.a&&!L[i+2].d)); // vocale anteriore?
 while(i<n){
  const x=L[i],y=L[i+1],c=x.c,d=y?y.c:'',ini=i===0,p=c+d;
  // 1) dittonghi vocalici (nessun accento/dieresi sulla prima lettera, nessuna dieresi sulla seconda)
  if(y&&!x.a&&!x.d&&!y.d&&V.includes(c)){
   const M={αι:'e',ει:'i',οι:'i',υι:'i',ου:'u'};
   if(M[p]){T.push({g:p,l:M[p],i:M[p],v:1,s:y.a,k:p,r:p+' = '+M[p]});i+=2;continue}
   if(p==='αυ'||p==='ευ'){
    const k=nx(i+2),f=!k||VL.includes(k),l=(c==='α'?'a':'e')+(f?'f':'v');
    T.push({g:p,l,i:l,v:1,s:y.a,k:p,r:`${p} = ${l}: davanti a ${k?(f?'consonante sorda':'vocale o consonante sonora')+' ('+k+')':'fine parola'} si pronuncia ${f?'f':'v'}`});i+=2;continue}
  }
  // 2) combinazioni consonantiche: [sistema, IPA, regola]
  const C={μπ:ini?['b','b','μπ a inizio parola = b']:['mb','mb','μπ all’interno = mb'],
   ντ:ini?['d','d','ντ a inizio parola = d']:['nd','nd','ντ all’interno = nd'],
   γκ:ini?['g','ɡ','γκ a inizio parola = g']:['ng','ŋɡ','γκ all’interno = ng'],
   γγ:['ng','ŋɡ','γγ = ng'],τσ:['ts','ts','τσ = ts'],τζ:['dz','dz','τζ = dz']}[p];
  if(C){T.push({g:p,l:C[0],i:C[1],v:0,s:0,k:p,r:C[2]});i+=2;continue}
  if(y&&c===d&&!V.includes(c)){T.push({g:p,l:SG[c],i:SI[c],v:0,s:0,k:'doppia',r:p+': consonante doppia = suono singolo ('+SG[c]+')'});i+=2;continue}
  // 3) lettera singola
  let l=SG[c],ip=SI[c],k=SR[c]?c:null,r=SR[c]||null;
  if(PAL[c]&&fr(y,i))ip=PAL[c];
  if(c==='γ'&&fr(y,i)){l=GFRONT;k='γ+palatale';r='γ davanti a vocale palatale: pronuncia palatale, resa con g'}
  if(c==='σ'&&d&&'βγδμν'.includes(d))ip='z';
  T.push({g:c,l,i:ip,v:V.includes(c)?1:0,s:V.includes(c)?x.a:0,k,r});i++;
 }
 const out=a=>T.map(t=>a&&t.s?t.l.replace(/[aeiou]/,m=>AC[m]):t.l).join('');
 // IPA: ˈ prima dell'attacco della sillaba tonica (solo parole con più vocali)
 const j=T.findIndex(t=>t.s&&t.v);let q=j;
 if(j>0)while(q>0&&!T[q-1].v&&ONS.has(T.slice(q-1,j).map(t=>t.g).join('')))q--;
 const mk=j>=0&&T.filter(t=>t.v).length>1;
 return{a:out(1),p:out(0),T,ipa:T.map((t,k)=>(mk&&k===q?'ˈ':'')+t.i).join('')};
}
function trs(s){ // parola o frase
 const W=s.split(/\s+/).map(tr).filter(r=>r.T.length);
 return{a:W.map(r=>r.a).join(' '),p:W.map(r=>r.p).join(' '),ipa:W.map(r=>r.ipa).join(' '),T:W.reduce((q,r,j)=>q.concat(j?[{g:' ',l:' ',i:' '}]:[],r.T),[])};
}
const ua=s=>s.replace(new RegExp('['+AX+']','g'),m=>'aeiou'[AX.indexOf(m)]);
const nz=s=>s.toLowerCase().replace(new RegExp('[^a-z'+AX+' ]','g'),' ').replace(/\s+/g,' ').trim();
const same=(v,R)=>{const u=nz(v);return u===(new RegExp('['+AX+']').test(u)?nz(R.a):R.p)};
function diff(v,R){let s=ua(nz(v));for(const t of R.T){if(s.startsWith(t.l))s=s.slice(t.l.length);else return t}return null}
///ENGINE
// ===== Lessico: 3 gruppi (A1-A2, B1-B2, C1-C2); ogni gruppo diviso a metà per i due livelli =====
const LEX=[
"ναι όχι δεν νερό ψωμί σπίτι γάτα σκύλος ψάρι γάλα τυρί κρασί καφές τσάι δρόμος ήλιος μπάλα ντομάτα καλός θάλασσα φεγγάρι μητέρα πατέρας παιδί φίλος αυτοκίνητο βιβλίο τραπέζι καρέκλα πόρτα παράθυρο λουλούδι αύριο σήμερα αυτοί γκρι πέντε ελληνικά τρώω θέλω",
"δουλειά ταξίδι ελπίδα ιστορία ζωή αγάπη μνήμη γειτονιά αγγλικά μπορώ ντύνομαι θυμάμαι ξεχνάω ανοίγω ευκαιρία πρόβλημα απάντηση ανάγκη ενδιαφέρον αεροδρόμιο βιβλιοθήκη εκπαίδευση καταλαβαίνω προσπαθώ ελευθερία πανεπιστήμιο",
"επιχείρηση ουσιαστικός διεθνής υποχρέωση αποτέλεσμα οικονομία δημοκρατία φιλοσοφία ευθύνη υπολογιστής αναπόφευκτος παρεξήγηση αντιμετώπιση διαφορετικός αυθαίρετος συγκέντρωση συγγενής ηλεκτρόνιο μικροσκόπιο τηλεπικοινωνία αυτοματισμός αλγόριθμος",
"άνθρωπος γυναίκα άντρας κορίτσι αγόρι οικογένεια αδελφός αδελφή γιαγιά παππούς θείος θεία ξάδελφος ξαδέλφη μωρό γονείς γιος κόρη σύζυγος γείτονας δάσκαλος μαθητής γιατρός νοσοκόμα αστυνομικός οδηγός μάγειρας αγρότης εργάτης καλλιτέχνης τραγουδιστής ηθοποιός συγγραφέας ζωγράφος μουσικός",
"σχολείο πανεπιστήμιο τάξη μάθημα γλώσσα λέξη γράμμα αριθμός πρόταση ερώτηση απάντηση τετράδιο μολύβι στυλό χαρτί γόμα χάρακας τσάντα υπολογιστής τηλέφωνο ρολόι ημερολόγιο εφημερίδα περιοδικό χάρτης φωτογραφία εικόνα μουσική τραγούδι ταινία θέατρο μουσείο βιβλιοθήκη εκκλησία νοσοκομείο φαρμακείο",
"κουζίνα μπάνιο υπνοδωμάτιο σαλόνι κήπος μπαλκόνι ταβάνι πάτωμα τοίχος σκάλα ασανσέρ κλειδί κλειδαριά κουτί μπουκάλι ποτήρι πιάτο μπολ κουτάλι πιρούνι μαχαίρι κατσαρόλα τηγάνι φούρνος ψυγείο ντουλάπι κρεβάτι μαξιλάρι κουβέρτα καναπές χαλί λάμπα καθρέφτης",
"μήλο πορτοκάλι μπανάνα σταφύλι λεμόνι καρπούζι πεπόνι φράουλα κεράσι ροδάκινο αχλάδι ανανάς πατάτα καρότο κρεμμύδι σκόρδο αγγούρι πιπεριά μαρούλι λάχανο φασόλια ρύζι μακαρόνια κρέας κοτόπουλο χοιρινό μοσχάρι αυγό βούτυρο γιαούρτι μέλι ζάχαρη αλάτι πιπέρι λάδι ξύδι",
"βουνό ποτάμι λίμνη δάσος δέντρο φύλλο κλαδί ρίζα γρασίδι πέτρα άμμος σύννεφο βροχή χιόνι άνεμος καταιγίδα αστέρι ουρανός γη φωτιά αέρας νερό νησί παραλία λιμάνι πλοίο αεροπλάνο τρένο λεωφορείο ποδήλατο μοτοσικλέτα ταξί δρόμος γέφυρα πλατεία χωριό πόλη χώρα σταθμός αεροδρόμιο ξενοδοχείο κατάστημα αγορά πάρκο",
"περπατώ τρέχω κάθομαι στέκομαι κοιμάμαι ξυπνάω τρώω πίνω μιλάω ακούω βλέπω γράφω διαβάζω μαθαίνω δουλεύω παίζω γελάω κλαίω τραγουδάω χορεύω ανοίγω κλείνω αγοράζω πουλάω πληρώνω αγαπώ θέλω μπορώ ξέρω καταλαβαίνω θυμάμαι ξεχνάω περιμένω ταξιδεύω επιστρέφω αρχίζω τελειώνω βοηθάω καθαρίζω μαγειρεύω πλένω κολυμπάω οδηγώ",
"καλύτερος χειρότερος μεγάλος μικρός ψηλός κοντός νέος παλιός όμορφος άσχημος γρήγορος αργός εύκολος δύσκολος ζεστός κρύος γλυκός πικρός αλμυρός ξινός δυνατός αδύναμος χαρούμενος λυπημένος κουρασμένος ευτυχισμένος σημαντικός έτοιμος ελεύθερος γεμάτος άδειος ανοιχτός κλειστός ακριβός φτηνός καθαρός βρώμικος σωστός λάθος",

la trascrizione.": ["Listen and choose the transcription.", "Höre zu und wähle die Transkription.", "Dëgjo dhe zgjidh transkriptimin."], "Come si legge {0}?": ["How is {0} read?", "Wie liest man {0}?", "Si lexohet {0}?"], "Esercizi Impara: {0} corrette su {1}": ["Learn exercises: {0} correct out of {1}", "Lernübungen: {0} von {1} richtig", "Ushtrimet e Mësimit: {0} të sakta nga {1}"], "24 lettere. “Nome ▶” legge il nome della lettera (non il suono isolato); il suono si sente nella parola d’esempio. Clicca una riga per la scheda.": ["24 letters. “Name ▶” reads the letter’s name (not the isolated sound); the sound is heard in the example word. Click a row for its card.", "24 Buchstaben. „Name ▶“ liest den Namen des Buchstabens (nicht den isolierten Laut); den Laut hörst du im Beispielwort. Klicke auf eine Zeile für die Karte.", "24 shkronja. “Emri ▶” lexon emrin e shkronjës (jo tingullin e veçuar); tingulli dëgjohet te fjala shembull. Kliko një rresht për kartën."], "Grafia, IPA e sistema, con le varianti dovute al contesto. Il sistema scrive sempre g, k, ch, s anche quando il suono cambia.": ["Spelling, IPA and system, with context-dependent variants. The system always writes g, k, ch, s even when the sound changes.", "Schreibweise, IPA und System, mit kontextabhängigen Varianten. Das System schreibt immer g, k, ch, s, auch wenn sich der Laut ändert.", "Shkrimi, IPA dhe sistemi, me variantet që varen nga konteksti. Sistemi shkruan gjithmonë g, k, ch, s edhe kur tingulli ndryshon."], "IPA fonemico semplificato (ι e υ davanti a vocale non sono scritte come semiconsonanti). L’audio legge una parola che contiene il suono, non il suono isolato.": ["Simplified phonemic IPA (ι and υ before a vowel are not written as semivowels). The audio reads a word containing the sound, not the isolated sound.", "Vereinfachtes phonemisches IPA (ι und υ vor einem Vokal werden nicht als Halbvokale geschrieben). Das Audio liest ein Wort mit dem Laut, nicht den isolierten Laut.", "IPA fonemike e thjeshtuar (ι dhe υ përpara një zanoreje nuk shkruhen si gjysmëzanore). Audioja lexon një fjalë që përmban tingullin, jo tingullin e veçuar."], "Il pulsante legge il nome della lettera, non il suono isolato: per sentire il suono ascolta la parola d’esempio.": ["The button reads the letter’s name, not the isolated sound: to hear the sound, listen to the example word.", "Die Schaltfläche liest den Namen des Buchstabens, nicht den isolierten Laut: Um den Laut zu hören, höre das Beispielwort.", "Butoni lexon emrin e shkronjës, jo tingullin e veçuar: për ta dëgjuar tingullin, dëgjo fjalën shembull."], "L’audio legge una parola con questo suono: la sintesi vocale non riproduce in modo affidabile un fonema isolato.": ["The audio reads a word with this sound: speech synthesis cannot reliably reproduce an isolated phoneme.", "Das Audio liest ein Wort mit diesem Laut: Sprachsynthese gibt ein einzelnes Phonem nicht zuverlässig wieder.", "Audioja lexon një fjalë me këtë tingull: sinteza e të folurit nuk riprodhon në mënyrë të besueshme një fonemë të veçuar."], "Nessuna voce greca (el-GR) trovata in questo browser: l’audio è disattivato. Installa una voce greca nelle impostazioni del sistema.": ["No Greek (el-GR) voice found in this browser: audio is disabled. Install a Greek voice in your system settings.", "Keine griechische Stimme (el-GR) in diesem Browser gefunden: Audio ist deaktiviert. Installiere eine griechische Stimme in den Systemeinstellungen.", "Nuk u gjet zë grek (el-GR) në këtë shfletues: audioja është çaktivizuar. Instalo një zë grek te cilësimet e sistemit."], "Le spiegazioni dettagliate (lezioni, regole, descrizioni IPA, errori frequenti) sono ancora disponibili solo in italiano.": ["The detailed explanations (lessons, rules, IPA descriptions, common mistakes) are still available in Italian only.", "Die ausführlichen Erklärungen (Lektionen, Regeln, IPA-Beschreibungen, häufige Fehler) gibt es noch nur auf Italienisch.", "Shpjegimet e hollësishme (mësimet, rregullat, përshkrimet IPA, gabimet e shpeshta) janë ende vetëm në italisht."]};
const FR=[["γ davanti a vocale palatale: pronuncia palatale, resa con g", ["γ before a palatal vowel: palatal pronunciation, written g", "γ vor einem palatalen Vokal: palatale Aussprache, als g geschrieben", "γ përpara një zanoreje palatale: shqiptim palatal, shkruhet g"]], ["davanti a vocale o consonante sonora", ["before a vowel or voiced consonant", "vor einem Vokal oder stimmhaften Konsonanten", "përpara një zanoreje ose bashkëtingëlloreje të zëshme"]], ["davanti a fine parola", ["at the end of the word", "am Wortende", "në fund të fjalës"]], ["davanti a consonante sorda", ["before a voiceless consonant", "vor einem stimmlosen Konsonanten", "përpara një bashkëtingëlloreje të pazëshme"]], ["consonante doppia = suono singolo", ["double consonant = single sound", "Doppelkonsonant = einfacher Laut", "bashkëtingëllore e dyfishtë = tingull i vetëm"]], ["sempre (da sola)", ["always (on its own)", "immer (allein)", "gjithmonë (vetëm)"]], ["a inizio parola", ["at the start of a word", "am Wortanfang", "në fillim të fjalës"]], ["a fine parola", ["at the end of a word", "am Wortende", "në fund të fjalës"]], ["tra vocali", ["between vowels", "zwischen Vokalen", "ndërmjet zanoreve"]], ["vocali non anteriori", ["non-front vowels", "nicht-vorderen Vokalen", "zanoreve jo të përparme"]], ["o a consonante", ["or a consonant", "oder einem Konsonanten", "ose një bashkëtingëllore"]], ["all’interno", ["inside a word", "im Wortinneren", "brenda fjalës"]], ["si pronuncia", ["it is pronounced", "spricht man", "shqiptohet"]], ["davanti a", ["before", "vor", "përpara"]], ["sempre", ["always", "immer", "gjithmonë"]]]; // frammenti per tradurre regole e contesti generati dal motore
Object.assign(L10,{"Eccezioni e varianti:": ["Exceptions and variants:", "Ausnahmen und Varianten:", "Përjashtime dhe variante:"], "Es.:": ["E.g.:", "Z. B.:", "P.sh.:"], "Significato": ["Meaning", "Bedeutung", "Kuptimi"], "αυ ed ευ: v o f": ["αυ and ευ: v or f", "αυ und ευ: v oder f", "αυ dhe ευ: v ose f"], "La seconda vocale si legge come consonante e segue la lettera successiva: <b>f</b> se è sorda (κ ξ π σ τ φ χ ψ θ) o se la parola finisce; <b>v</b> se è una vocale o una consonante sonora (β γ δ ζ λ μ ν ρ).": ["The second vowel is read as a consonant and follows the next letter: <b>f</b> if it is voiceless (κ ξ π σ τ φ χ ψ θ) or the word ends; <b>v</b> if it is a vowel or a voiced consonant (β γ δ ζ λ μ ν ρ).", "Der zweite Vokal wird als Konsonant gesprochen und richtet sich nach dem nächsten Buchstaben: <b>f</b>, wenn dieser stimmlos ist (κ ξ π σ τ φ χ ψ θ) oder das Wort endet; <b>v</b> vor Vokal oder stimmhaftem Konsonanten (β γ δ ζ λ μ ν ρ).", "Zanorja e dytë lexohet si bashkëtingëllore dhe varet nga shkronja pasuese: <b>f</b> nëse ajo është e pazëshme (κ ξ π σ τ φ χ ψ θ) ose fjala mbaron; <b>v</b> para zanoreje ose bashkëtingëlloreje të zëshme (β γ δ ζ λ μ ν ρ)."], "μπ, ντ, γκ, γγ: inizio o interno": ["μπ, ντ, γκ, γγ: start or inside the word", "μπ, ντ, γκ, γγ: Wortanfang oder Wortinneres", "μπ, ντ, γκ, γγ: në fillim ose brenda fjalës"], "A inizio parola danno /b d ɡ/; all’interno /mb nd ŋɡ/ (la nasale si sente). γγ è sempre /ŋɡ/.": ["At the start of a word they give /b d ɡ/; inside a word /mb nd ŋɡ/ (the nasal is heard). γγ is always /ŋɡ/.", "Am Wortanfang ergeben sie /b d ɡ/; im Wortinneren /mb nd ŋɡ/ (der Nasal ist zu hören). γγ ist immer /ŋɡ/.", "Në fillim të fjalës japin /b d ɡ/; brenda fjalës /mb nd ŋɡ/ (hundorja dëgjohet). γγ është gjithmonë /ŋɡ/."], "Suoni simili per un italofono": ["Look-alike sounds for English speakers", "Ähnlich klingende Laute für Deutschsprachige", "Tinguj të ngjashëm për folësit e shqipes"], "<b>θ /θ/ e δ /ð/</b>: entrambe interdentali; θ sorda, δ sonora.": ["<b>θ /θ/ and δ /ð/</b>: you already have them (“think”, “this”), but Greek spells them with single letters; they differ only in voicing.", "<b>θ /θ/ und δ /ð/</b>: beide interdental, θ stimmlos, δ stimmhaft; im Deutschen nicht vorhanden.", "<b>θ /θ/ dhe δ /ð/</b>: të dyja ndërdhëmbore, θ e pazëshme, δ e zëshme, njësoj si “th” dhe “dh” shqip."], "<b>χ /x/ e γ /ɣ/</b>: stesso punto, sorda e sonora; nessuna è la h italiana.": ["<b>χ /x/ and γ /ɣ/</b>: same place, voiceless and voiced; neither is an English h or hard g.", "<b>χ /x/ und γ /ɣ/</b>: gleiche Stelle, stimmlos und stimmhaft; χ kennst du aus „Bach“.", "<b>χ /x/ dhe γ /ɣ/</b>: i njëjti vend, e pazëshme dhe e zëshme; asnjëra nuk është “h” shqipe."], "<b>κ /k/ e γκ /ɡ/</b>: sorda e sonora.": ["<b>κ /k/ and γκ /ɡ/</b>: voiceless and voiced (like “skin” and “go”).", "<b>κ /k/ und γκ /ɡ/</b>: stimmlos und stimmhaft.", "<b>κ /k/ dhe γκ /ɡ/</b>: e pazëshme dhe e zëshme (k / g)."], "<b>π /p/ e μπ /b/</b>: sorda e sonora a inizio parola.": ["<b>π /p/ and μπ /b/</b>: voiceless (no puff of air, as in “spin”) and voiced at the start of a word.", "<b>π /p/ und μπ /b/</b>: stimmlos (ohne starke Behauchung) und stimmhaft am Wortanfang.", "<b>π /p/ dhe μπ /b/</b>: e pazëshme dhe e zëshme në fillim të fjalës (p / b)."], "Ogni parola con più sillabe ha una <b>sillaba tonica</b>, segnata con l’accento grafico (τόνος) sulla vocale. Nei digrafi l’accento sta sulla seconda lettera (αί, ού) e il digrafo resta un suono solo; se sta sulla prima (άι) le vocali si leggono separate. I monosillabi di norma non hanno accento (eccezioni: πού, πώς).": ["Every word with more than one syllable has a <b>stressed syllable</b>, marked with the written accent (τόνος) on the vowel. In digraphs the accent sits on the second letter (αί, ού) and the digraph stays one sound; if it sits on the first (άι) the vowels are read separately. Monosyllables normally carry no accent (exceptions: πού, πώς).", "Jedes Wort mit mehr als einer Silbe hat eine <b>betonte Silbe</b>, die mit dem Akzentzeichen (τόνος) auf dem Vokal markiert wird. Bei Vokalkombinationen steht der Akzent auf dem zweiten Buchstaben (αί, ού), und die Kombination bleibt ein Laut; steht er auf dem ersten (άι), werden die Vokale getrennt gesprochen. Einsilbige Wörter tragen in der Regel keinen Akzent (Ausnahmen: πού, πώς).", "Çdo fjalë me më shumë se një rrokje ka një <b>rrokje të theksuar</b>, të shënuar me theksin e shkruar (τόνος) mbi zanore. Te kombinimet theksi qëndron mbi shkronjën e dytë (αί, ού) dhe kombinimi mbetet një tingull; nëse qëndron mbi të parën (άι), zanoret lexohen të ndara. Fjalët njërrokëshe zakonisht nuk kanë theks (përjashtime: πού, πώς)."], "In greco l’accento è di intensità e le vocali atone non si riducono. Cambiare la sillaba tonica può cambiare il significato. Nella trascrizione dell’app l’accento si scrive sulla vocale tonica con questo segno: <b>{0}</b>.": ["In Greek, stress is a matter of loudness, and unstressed vowels are never reduced to “uh” as they are in English. Changing the stressed syllable can change the meaning. In this app’s transcription the stressed vowel carries this mark: <b>{0}</b>.", "Im Griechischen ist die Betonung dynamisch (lauter), und unbetonte Vokale werden nicht abgeschwächt (kein Schwa wie in „Hase“). Eine andere betonte Silbe kann die Bedeutung ändern. In der Transkription der App trägt der betonte Vokal dieses Zeichen: <b>{0}</b>.", "Në greqisht theksi është i intensitetit dhe zanoret e patheksuara nuk zbuten (nuk ka “ë” si në shqip). Ndryshimi i rrokjes së theksuar mund ta ndryshojë kuptimin. Në transkriptimin e aplikacionit zanorja e theksuar mban këtë shenjë: <b>{0}</b>."], "Posizione dell’accento": ["Position of the stress", "Stellung der Betonung", "Vendi i theksit"], "ultima sillaba": ["last syllable", "letzte Silbe", "rrokja e fundit"], "penultima": ["second-to-last", "vorletzte", "parafundit"], "terzultima": ["third-to-last", "drittletzte", "e treta nga fundi"], "Cambia l’accento, cambia la parola": ["Change the stress, change the word", "Andere Betonung, anderes Wort", "Ndryshon theksi, ndryshon fjala"], "Monosillabi con accento": ["Monosyllables with an accent", "Einsilbige Wörter mit Akzent", "Fjalë njërrokëshe me theks"], "legge": ["law", "Gesetz", "ligj"], "provincia": ["prefecture", "Präfektur", "prefekturë"], "paese": ["country", "Land", "vend"], "ci sta, entra": ["it fits", "es passt hinein", "nxë, ka vend"], "quando": ["when", "wann", "kur"], "mai": ["never", "nie", "asnjëherë"]});
const X={"en": {"les": [{"t": "Vowels and consonants", "sp": "Greek has 5 vowel sounds (/a e i o u/) written with 7 letters, plus 17 consonant letters. Different letters can have the same sound.", "rule": "α=a · ε=e · η, ι, υ=i · ο, ω=o. Vowels are always pronounced in full, even when unstressed.", "exc": "Before another vowel, ι and υ can become semivowels (ia ≈ “ya”): the IPA in this app is phonemic and simplified on this point."}, {"t": "Vowel combinations", "sp": "Some pairs of vowels are read as a single sound.", "rule": "αι=e · ει, οι, υι=i · ου=u · αυ=av/af · ευ=ev/ef.", "exc": "If the stress falls on the first vowel (άι, όι) or there is a diaeresis (ϊ, ϋ), the two vowels are read separately: γάιδαρος = gàidharos."}, {"t": "Double consonants", "sp": "Double consonants are pronounced as one: they do not lengthen the sound or change the vowel before them.", "rule": "λλ, σσ, κκ, ττ, νν, μμ, ρρ = one sound: ελληνικά = elinika.", "exc": "γγ is not a double: it is read ng."}, {"t": "Consonant combinations", "sp": "Greek has no single letters for /b d ɡ/: it writes them with μπ, ντ, γκ. γγ, τσ and τζ also have their own sounds.", "rule": "At the start of a word μπ=b, ντ=d, γκ=g. Inside a word mb, nd, ng. γγ=ng, τσ=ts, τζ=dz.", "exc": "In loanwords you may hear /b d ɡ/ without the nasal even inside a word; the app’s system uses the position rule. ξ=ks and ψ=ps are single letters with two sounds."}, {"t": "Context-dependent sounds", "sp": "Before front vowels (ε, η, ι, υ, αι, ει, οι) γ, κ, χ become palatal; σ before β, γ, δ, μ, ν becomes voiced.", "rule": "γ /ɣ/→/ʝ/ · κ /k/→/c/ · χ /x/→/ç/ · σ /s/→/z/.", "exc": "The system does not write these differences: γάλα = gàla and γέρος = gèros have the same g in transcription but different sounds."}, {"t": "Stress and written accents", "sp": "Every word with more than one syllable has a stressed syllable, marked with the written accent on the vowel. In digraphs the accent goes on the second letter.", "rule": "In the transcription the accent goes on the stressed vowel: καφές = kafès.", "exc": "Monosyllables normally carry no accent (exceptions: πού, πώς). Capitals without the accent do not show the stressed syllable."}, {"t": "Diaeresis and split diphthongs", "sp": "The diaeresis (¨) on ι or υ shows that they do not form a digraph with the preceding vowel.", "rule": "αϊ, οϊ, ϋ = separate vowels: ταΐζω = taìzo.", "exc": "An accent on the first vowel also splits the digraph: άι, όι."}, {"t": "The difference between σ and ς", "sp": "σ and ς are the same letter: ς is used only at the end of a word.", "rule": "σ = ς = s. In capitals it is always Σ.", "exc": "σ before β, γ, δ, μ, ν is pronounced /z/ (σβήνω, κόσμος); at the end of a word ς stays /s/."}, {"t": "How to read words", "sp": "The method is always the same, in the right order.", "rule": "1) recognise digraphs and clusters (αι, ου, μπ…) · 2) transcribe single letters · 3) apply context (αυ/ευ, palatals) · 4) mark the stress.", "exc": "Never substitute letter by letter: combinations must be recognised first."}, {"t": "How to read words you have never seen", "sp": "Greek is very regular: the spelling almost always shows the pronunciation.", "rule": "Digraphs and clusters → single letters → context → stress.", "exc": "Foreign words and proper names can have irregular pronunciations."}], "cmb": ["One sound, same as ε. If the stress falls on the α (άι) or there is a diaeresis (αϊ), the vowels are read separately.", "One sound /i/, same as η, ι, υ (never “ay”).", "One sound /i/ (never “oy”).", "One sound /i/; rare, found in learned words.", "One sound /u/. Written u in the system, never “ou”.", "/af/ before a voiceless consonant (κ ξ π σ τ φ χ ψ θ) and at the end of a word; /av/ before a vowel or voiced consonant (β γ δ ζ λ μ ν ρ). Never “ow”.", "Same rule as αυ: /ef/ before a voiceless consonant and at the end of a word; /ev/ before a vowel or voiced consonant. Never “yoo”.", "At the start of a word = /b/; inside a word = /mb/. In loanwords you may hear /b/ without the nasal inside a word.", "At the start of a word = /d/; inside a word = /nd/.", "At the start of a word = /ɡ/; inside a word = /ŋɡ/ (velar n + g, as in “finger”).", "Always /ŋɡ/ (as in “finger”, not “ginger”); not a double letter: ng in the system.", "One affricate sound, like the ts in “cats”.", "One affricate sound, like the ds in “beds”."], "ip": ["Open central vowel, like the a in “father”.", "Mid front vowel, like the e in “bed”, a little tighter.", "Close front vowel, like the i in “machine” (never the short “bit” vowel).", "Mid back rounded vowel, like the o in “more”, short and pure (no “oh” glide).", "Close back vowel, like the oo in “moon”, but shorter.", "Voiceless bilabial stop, like the p in “spin” (no puff of air).", "Voiceless dental stop, like the t in “stop” (no puff of air).", "Voiceless velar stop, like the k in “skin”.", "Voiceless palatal stop: the k moves forward to the palate, close to the k in “key”.", "Voiced bilabial stop, like the b in “bad”.", "Voiced dental stop, like the d in “dog”.", "Voiced velar stop, like the g in “go”.", "Voiceless labiodental fricative, like the f in “fan”.", "Voiced labiodental fricative, like the v in “van”.", "Voiceless interdental fricative: tongue between the teeth, like the th in “think”.", "Voiced interdental fricative, like the th in “this”. It is not a d.", "Voiceless alveolar fricative, like the s in “sun”; it stays voiceless even between vowels (never a z).", "Voiced alveolar fricative, like the z in “zoo”.", "Voiceless velar fricative, like the ch in Scottish “loch” or German “Bach”. Not an English h.", "Voiceless palatal fricative, like the h in “huge”.", "Voiced velar fricative: a soft “g” with friction and no closure; not the g of “go”.", "Voiced palatal fricative, like the y in “yes” with a little friction.", "Bilabial nasal, like the m in “man”.", "Alveolar nasal, like the n in “no”.", "Velar nasal, like the ng in “finger”: it comes before /ɡ/ in the cluster /ŋɡ/.", "Alveolar lateral, like the clear l in “let”.", "Short tap (one flick of the tongue), like the tt in American “butter”.", "Voiceless alveolar affricate, like the ts in “cats”.", "Voiced alveolar affricate, like the ds in “beds”.", "Two sounds /k/+/s/ written with one letter, like the x in “box”.", "Two sounds /p/+/s/ written with one letter, like the ps in “lapse”."], "err": ["<b>θ and δ are the two “th” sounds of English.</b> θ as in “think”, δ as in “this”. In the system they are th and dh, never t or d.", "<b>χ is not “k” or a silent h.</b> It is the “ch” of Scottish “loch”; before e/i it sounds like the h of “huge”.", "<b>γ is not the “g” of “go”.</b> It is a soft, voiced friction /ɣ/; before e/i it is like the “y” of “yes”. The “g” of “go” is written γκ.", "<b>β is v, not b.</b> A b is written μπ.", "<b>η, ι, υ, ει, οι and υι are all i</b> (as in “machine”), never “ay”, “oy” or “eye”.", "<b>αι is e</b> (as in “bed”), never “eye”; <b>ου is u</b> (“moon”), not “ow”.", "<b>αυ and ευ are not “ow” and “yoo”:</b> they are av/af and ev/ef.", "<b>Double letters do not lengthen the sound.</b> ελληνικά = elinika.", "<b>σ stays voiceless between vowels</b> (the s of “sun”, not z); ζ is the z of “zoo”.", "<b>ρ is a single tap of the tongue,</b> not the English r.", "<b>ο and ω are a pure, short o</b> (no “oh” glide); unstressed vowels never reduce to “uh”.", "<b>ξ = ks and ψ = ps</b> are single letters, also pronounced at the start of a word (ψωμί = psomi)."]}, "de": {"les": [{"t": "Vokale und Konsonanten", "sp": "Das Griechische hat 5 Vokallaute (/a e i o u/), geschrieben mit 7 Buchstaben, und 17 Konsonantenbuchstaben. Verschiedene Buchstaben können denselben Laut haben.", "rule": "α=a · ε=e · η, ι, υ=i · ο, ω=o. Vokale werden immer voll ausgesprochen, auch unbetont.", "exc": "Vor einem anderen Vokal können ι und υ zu Halbvokalen werden (ia ≈ „ja“): Das IPA dieser App ist phonemisch und an dieser Stelle vereinfacht."}, {"t": "Vokalkombinationen", "sp": "Einige Vokalpaare werden als ein einziger Laut gesprochen.", "rule": "αι=e · ει, οι, υι=i · ου=u · αυ=av/af · ευ=ev/ef.", "exc": "Liegt der Akzent auf dem ersten Vokal (άι, όι) oder steht ein Trema (ϊ, ϋ), werden die beiden Vokale getrennt gesprochen: γάιδαρος = gàidharos."}, {"t": "Doppelkonsonanten", "sp": "Doppelkonsonanten werden wie ein einfacher Konsonant gesprochen: Sie verlängern den Laut nicht und kürzen den vorangehenden Vokal nicht.", "rule": "λλ, σσ, κκ, ττ, νν, μμ, ρρ = ein Laut: ελληνικά = elinika.", "exc": "γγ ist keine Doppelung: Es wird ng gesprochen."}, {"t": "Konsonantenkombinationen", "sp": "Das Griechische hat keine eigenen Buchstaben für /b d ɡ/: Es schreibt sie mit μπ, ντ, γκ. Auch γγ, τσ und τζ haben eigene Laute.", "rule": "Am Wortanfang μπ=b, ντ=d, γκ=g. Im Wortinneren mb, nd, ng. γγ=ng, τσ=ts, τζ=dz.", "exc": "In Fremdwörtern hört man auch im Wortinneren /b d ɡ/ ohne Nasal; das System der App folgt der Positionsregel. ξ=ks und ψ=ps sind einzelne Buchstaben mit zwei Lauten."}, {"t": "Kontextabhängige Laute", "sp": "Vor vorderen Vokalen (ε, η, ι, υ, αι, ει, οι) werden γ, κ, χ palatal; σ vor β, γ, δ, μ, ν wird stimmhaft.", "rule": "γ /ɣ/→/ʝ/ · κ /k/→/c/ · χ /x/→/ç/ · σ /s/→/z/.", "exc": "Das System schreibt diese Unterschiede nicht: γάλα = gàla und γέρος = gèros haben in der Transkription dasselbe g, aber verschiedene Laute."}, {"t": "Betonung und Akzentzeichen", "sp": "Jedes Wort mit mehr als einer Silbe hat eine betonte Silbe, die mit dem Akzentzeichen auf dem Vokal markiert wird. Bei Vokalkombinationen steht der Akzent auf dem zweiten Buchstaben.", "rule": "In der Transkription steht der Akzent auf dem betonten Vokal: καφές = kafès.", "exc": "Einsilbige Wörter tragen in der Regel keinen Akzent (Ausnahmen: πού, πώς). Großbuchstaben ohne Akzent zeigen die betonte Silbe nicht an."}, {"t": "Trema und getrennte Vokale", "sp": "Das Trema (¨) auf ι oder υ zeigt an, dass sie mit dem vorangehenden Vokal keine Kombination bilden.", "rule": "αϊ, οϊ, ϋ = getrennte Vokale: ταΐζω = taìzo.", "exc": "Auch ein Akzent auf dem ersten Vokal trennt die Kombination: άι, όι."}, {"t": "Der Unterschied zwischen σ und ς", "sp": "σ und ς sind derselbe Buchstabe: ς steht nur am Wortende.", "rule": "σ = ς = s. In Großbuchstaben immer Σ.", "exc": "σ vor β, γ, δ, μ, ν wird /z/ gesprochen (σβήνω, κόσμος); am Wortende bleibt ς /s/."}, {"t": "Wörter lesen", "sp": "Die Methode ist immer dieselbe, in der richtigen Reihenfolge.", "rule": "1) Kombinationen erkennen (αι, ου, μπ …) · 2) Einzelbuchstaben transkribieren · 3) Kontext anwenden (αυ/ευ, Palatale) · 4) Betonung markieren.", "exc": "Niemals Buchstabe für Buchstabe ersetzen: Kombinationen werden zuerst erkannt."}, {"t": "Unbekannte Wörter lesen", "sp": "Das Griechische ist sehr regelmäßig: Die Schreibung zeigt fast immer die Aussprache.", "rule": "Kombinationen → Einzelbuchstaben → Kontext → Betonung.", "exc": "Fremdwörter und Eigennamen können unregelmäßig ausgesprochen werden."}], "cmb": ["Ein Laut, gleich wie ε (nicht wie deutsches „ai“). Liegt der Akzent auf α (άι) oder steht ein Trema (αϊ), werden die Vokale getrennt gesprochen.", "Ein Laut /i/, wie η, ι, υ (nicht wie deutsches „ei“ = „ai“).", "Ein Laut /i/ (nicht wie deutsches „eu“).", "Ein Laut /i/; selten, in gehobenen Wörtern.", "Ein Laut /u/. Im System u, nie „ou“.", "/af/ vor stimmlosem Konsonant (κ ξ π σ τ φ χ ψ θ) und am Wortende; /av/ vor Vokal oder stimmhaftem Konsonant (β γ δ ζ λ μ ν ρ). Nicht wie deutsches „au“.", "Gleiche Regel wie αυ: /ef/ vor stimmlosem Konsonant und am Wortende; /ev/ vor Vokal oder stimmhaftem Konsonant. Nicht wie deutsches „eu“.", "Am Wortanfang = /b/; im Wortinneren = /mb/. In Fremdwörtern hört man im Inneren auch /b/ ohne Nasal.", "Am Wortanfang = /d/; im Wortinneren = /nd/.", "Am Wortanfang = /ɡ/; im Wortinneren = /ŋɡ/ (velares n + g, wie in „Angst“).", "Immer /ŋɡ/ (wie in „Angst“); keine Doppelung: ng im System.", "Ein Affrikatenlaut, wie das deutsche z in „Zeit“ (ts).", "Ein Affrikatenlaut: das stimmhafte Gegenstück zu ts (dz)."], "ip": ["Offener Zentralvokal, wie das a in „Rat“ (kurz).", "Halbgeschlossener Vorderzungenvokal, wie das e in „Bett“, etwas geschlossener.", "Geschlossener Vorderzungenvokal, wie das i in „Lied“, aber kurz.", "Halbgeschlossener gerundeter Hinterzungenvokal, wie das o in „Kohle“, aber kurz und rein.", "Geschlossener Hinterzungenvokal, wie das u in „gut“.", "Stimmloser bilabialer Verschlusslaut, wie das p in „Spiel“ (ohne starke Behauchung).", "Stimmloser dentaler Verschlusslaut, wie das t in „Stein“ (ohne starke Behauchung).", "Stimmloser velarer Verschlusslaut, wie das k in „Skat“.", "Stimmloser palataler Verschlusslaut: das k wandert nach vorn zum Gaumen, wie das k in „Kiel“.", "Stimmhafter bilabialer Verschlusslaut, wie das b in „Bett“.", "Stimmhafter dentaler Verschlusslaut, wie das d in „Dach“.", "Stimmhafter velarer Verschlusslaut, wie das g in „Gast“.", "Stimmloser labiodentaler Reibelaut, wie das f in „Fisch“.", "Stimmhafter labiodentaler Reibelaut, wie das w in „Wasser“.", "Stimmloser interdentaler Reibelaut: Zunge zwischen den Zähnen, wie das englische th in „think“. Im Deutschen nicht vorhanden.", "Stimmhafter interdentaler Reibelaut, wie das englische th in „this“. Kein d.", "Stimmloser alveolarer Reibelaut, wie das ß in „Straße“; bleibt auch zwischen Vokalen stimmlos (anders als in „Rose“).", "Stimmhafter alveolarer Reibelaut, wie das s in „Rose“ (nicht das deutsche z!).", "Stimmloser velarer Reibelaut, wie das ch in „Bach“.", "Stimmloser palataler Reibelaut, wie das ch in „ich“.", "Stimmhafter velarer Reibelaut: wie ein weiches g ohne Verschluss (norddeutsch etwa in „sagen“); nicht das g von „Gast“.", "Stimmhafter palataler Reibelaut, wie das j in „Jahr“ mit etwas Reibung.", "Bilabialer Nasal, wie das m in „Mama“.", "Alveolarer Nasal, wie das n in „Nase“.", "Velarer Nasal, wie das ng in „lang“: Er steht vor /ɡ/ in der Gruppe /ŋɡ/.", "Alveolarer Lateral, wie das l in „Lampe“.", "Kurzer Zungenschlag (ein einziger Schlag der Zungenspitze), wie ein ganz kurzes gerolltes r.", "Stimmlose alveolare Affrikate, wie das z in „Zeit“.", "Stimmhafte alveolare Affrikate: das stimmhafte Gegenstück zu ts.", "Zwei Laute /k/+/s/ mit einem Buchstaben geschrieben, wie das x in „Hexe“.", "Zwei Laute /p/+/s/ mit einem Buchstaben geschrieben, wie das ps in „Gips“."], "err": ["<b>θ und δ gibt es im Deutschen nicht:</b> Es sind die beiden englischen „th“ (think / this). Im System th und dh, nie t/d oder s/z.", "<b>χ kennst du:</b> wie ch in „Bach“; vor e/i wie ch in „ich“. Im System immer ch.", "<b>γ ist weder deutsches „g“ noch „j“.</b> Vor a/o ist es ein weicher Reibelaut /ɣ/, vor e/i wie „j“ mit Reibung /ʝ/. Das „g“ von „Gast“ schreibt man γκ.", "<b>β wird wie deutsches „w“ gesprochen</b> (Wasser) – im System v. Ein b schreibt man μπ.", "<b>ζ ist stimmhaftes s</b> (wie in „Rose“), nicht deutsches z (= ts)! Das deutsche z entspricht τσ.", "<b>σ ist stimmlos</b> (wie ß), auch zwischen Vokalen – anders als in „Rose“; nur vor β, γ, δ, μ, ν wird es zu /z/.", "<b>ει ist /i/</b> (nicht „ai“), <b>αι ist /e/</b> (nicht „ai“), <b>οι ist /i/</b> (nicht „eu“); <b>υ ist /i/</b>, nicht „ü“.", "<b>αυ und ευ klingen nicht wie deutsches „au“ und „eu“,</b> sondern av/af und ev/ef.", "<b>ου ist /u/:</b> im System u, nicht „ou“.", "<b>Doppelte Konsonanten werden nicht gedehnt</b> und kürzen den Vokal nicht: ελληνικά = elinika.", "<b>ρ ist ein einzelner Zungenschlag</b> (Zungenspitzen-r), kein Rachen-r.", "<b>ξ = ks und ψ = ps</b> sind einzelne Buchstaben, auch am Wortanfang zu sprechen (ψωμί = psomi); unbetonte Vokale werden nicht abgeschwächt."]}, "sq": {"les": [{"t": "Zanoret dhe bashkëtingëlloret", "sp": "Greqishtja ka 5 tinguj zanorë (/a e i o u/) të shkruar me 7 shkronja, dhe 17 shkronja bashkëtingëllore. Shkronja të ndryshme mund të kenë të njëjtin tingull.", "rule": "α=a · ε=e · η, ι, υ=i · ο, ω=o. Zanoret shqiptohen gjithmonë plotë, edhe kur janë të patheksuara.", "exc": "Para një zanoreje tjetër, ι dhe υ mund të bëhen gjysmëzanore (ia ≈ “ja”): IPA e këtij aplikacioni është fonemike dhe e thjeshtuar në këtë pikë."}, {"t": "Kombinimet e zanoreve", "sp": "Disa çifte zanoresh lexohen si një tingull i vetëm.", "rule": "αι=e · ει, οι, υι=i · ου=u · αυ=av/af · ευ=ev/ef.", "exc": "Nëse theksi bie mbi zanoren e parë (άι, όι) ose ka dialitikën (ϊ, ϋ), dy zanoret lexohen të ndara: γάιδαρος = gàidharos."}, {"t": "Bashkëtingëlloret e dyfishta", "sp": "Bashkëtingëlloret e dyfishta shqiptohen si një e vetme: nuk e zgjasin tingullin.", "rule": "λλ, σσ, κκ, ττ, νν, μμ, ρρ = një tingull: ελληνικά = elinika.", "exc": "γγ nuk është dyfishim: lexohet ng. Edhe λλ lexohet l e thjeshtë (jo “ll” shqip)."}, {"t": "Kombinimet e bashkëtingëlloreve", "sp": "Greqishtja nuk ka shkronja të veçanta për /b d ɡ/: i shkruan me μπ, ντ, γκ. Edhe γγ, τσ dhe τζ kanë tinguj të vetët.", "rule": "Në fillim të fjalës μπ=b, ντ=d, γκ=g. Brenda fjalës mb, nd, ng. γγ=ng, τσ=ts, τζ=dz.", "exc": "Te huazimet mund të dëgjohet /b d ɡ/ pa hundoren edhe brenda fjalës; sistemi i aplikacionit ndjek rregullin e pozicionit. ξ=ks dhe ψ=ps janë shkronja të vetme me dy tinguj."}, {"t": "Tinguj që varen nga konteksti", "sp": "Para zanoreve të përparme (ε, η, ι, υ, αι, ει, οι) γ, κ, χ bëhen palatale; σ para β, γ, δ, μ, ν bëhet e zëshme.", "rule": "γ /ɣ/→/ʝ/ · κ /k/→/c/ · χ /x/→/ç/ · σ /s/→/z/.", "exc": "Sistemi nuk i shkruan këto dallime: γάλα = gàla dhe γέρος = gèros kanë të njëjtën g në transkriptim, por tinguj të ndryshëm."}, {"t": "Theksi dhe shenjat e theksit", "sp": "Çdo fjalë me më shumë se një rrokje ka një rrokje të theksuar, e shënuar me theksin mbi zanore. Te kombinimet e zanoreve theksi vihet mbi shkronjën e dytë.", "rule": "Në transkriptim theksi vihet mbi zanoren e theksuar: καφές = kafès.", "exc": "Fjalët njërrokëshe zakonisht nuk kanë theks (përjashtime: πού, πώς). Shkronjat e mëdha pa theks nuk tregojnë rrokjen e theksuar."}, {"t": "Dialitika dhe zanoret e ndara", "sp": "Dialitika (¨) mbi ι ose υ tregon se nuk formojnë kombinim me zanoren paraprake.", "rule": "αϊ, οϊ, ϋ = zanore të ndara: ταΐζω = taìzo.", "exc": "Edhe një theks mbi zanoren e parë e ndan kombinimin: άι, όι."}, {"t": "Dallimi midis σ dhe ς", "sp": "σ dhe ς janë e njëjta shkronjë: ς përdoret vetëm në fund të fjalës.", "rule": "σ = ς = s. Me shkronja të mëdha është gjithmonë Σ.", "exc": "σ para β, γ, δ, μ, ν shqiptohet /z/ (σβήνω, κόσμος); në fund të fjalës ς mbetet /s/."}, {"t": "Si lexohen fjalët", "sp": "Metoda është gjithmonë e njëjta, sipas radhës.", "rule": "1) njih kombinimet (αι, ου, μπ…) · 2) transkripto shkronjat e vetme · 3) zbato kontekstin (αυ/ευ, palatalet) · 4) shëno theksin.", "exc": "Kurrë mos zëvendëso shkronjë për shkronjë: kombinimet njihen të parat."}, {"t": "Si lexohen fjalët e panjohura", "sp": "Greqishtja është shumë e rregullt: shkrimi pothuajse gjithmonë tregon shqiptimin.", "rule": "Kombinimet → shkronjat e vetme → konteksti → theksi.", "exc": "Fjalët e huaja dhe emrat e përveçëm mund të kenë shqiptim të parregullt."}], "cmb": ["Një tingull i vetëm, si ε. Nëse theksi bie mbi α (άι) ose ka dialitikën (αϊ), zanoret lexohen të ndara.", "Një tingull /i/, si η, ι, υ.", "Një tingull /i/.", "Një tingull /i/; e rrallë, në fjalë të kultivuara.", "Një tingull /u/. Në sistem shkruhet u, kurrë “ou”.", "/af/ para bashkëtingëlloreje të pazëshme (κ ξ π σ τ φ χ ψ θ) dhe në fund të fjalës; /av/ para zanoreje ose bashkëtingëlloreje të zëshme (β γ δ ζ λ μ ν ρ).", "I njëjti rregull si për αυ: /ef/ para të pazëshmes dhe në fund të fjalës; /ev/ para zanoreje ose të zëshmeje.", "Në fillim të fjalës = /b/; brenda fjalës = /mb/. Te huazimet, brenda fjalës mund të dëgjohet /b/ pa hundoren.", "Në fillim të fjalës = /d/; brenda fjalës = /nd/.", "Në fillim të fjalës = /ɡ/; brenda fjalës = /ŋɡ/ (n velare + g).", "Gjithmonë /ŋɡ/; nuk është dyfishim: ng në sistem.", "Një tingull afrikat, si “c” shqip (ts).", "Një tingull afrikat, si “x” shqip (dz)."], "ip": ["Zanore e hapur qendrore, si “a” te “mal”.", "Zanore e përparme e mesme, si const LES=[
{t:'Vocali e consonanti',sp:`Il greco ha 5 suoni vocalici (/a e i o u/) scritti con 7 lettere, e 17 lettere consonantiche. Lettere diverse possono avere lo stesso suono.`,rule:`α=a · ε=e · η, ι, υ=i · ο, ω=o. Le vocali si pronunciano sempre piene, anche quando sono atone.`,exc:`Davanti a un’altra vocale ι e υ possono diventare semiconsonanti (ia ≈ “ya”): l’IPA di questa app è fonemico e semplificato su questo punto.`,ex:['μάτι','φίλος','νερό','ώρα']},
{t:'Combinazioni vocaliche',sp:`Alcune coppie di vocali si leggono come un suono solo.`,rule:`αι=e · ει, οι, υι=i · ου=u · αυ=av/af · ευ=ev/ef.`,exc:`Se l’accento cade sulla prima vocale (άι, όι) o c’è la dieresi (ϊ, ϋ), le due vocali si leggono separate: γάιδαρος = gàidharos.`,ex:['παιδί','είναι','ουρανός','αυτί','γάιδαρος']},
{t:'Consonanti doppie',sp:`Le consonanti scritte doppie si pronunciano come una consonante semplice: non c’è raddoppiamento come in italiano.`,rule:`λλ, σσ, κκ, ττ, νν, μμ, ρρ = un solo suono: ελληνικά = elinika.`,exc:`γγ non è una doppia: si legge ng.`,ex:['ελληνικά','θάλασσα','κόκκινο','κρεμμύδι']},
{t:'Combinazioni consonantiche',sp:`Il greco non ha lettere per /b d ɡ/: li scrive con μπ, ντ, γκ. Anche γγ, τσ, τζ hanno suoni propri.`,rule:`A inizio parola μπ=b, ντ=d, γκ=g. All’interno mb, nd, ng. γγ=ng, τσ=ts, τζ=dz.`,exc:`Nei prestiti si può sentire /b d ɡ/ senza nasale anche all’interno; nel sistema dell’app vale la regola di posizione. ξ=ks e ψ=ps sono lettere singole con due suoni.`,ex:['μπάλα','ντομάτα','γκρι','τσάι','τζάμι','αγκαλιά']},
{t:'Suoni dipendenti dal contesto',sp:`Davanti a vocali anteriori (ε, η, ι, υ, αι, ει, οι) γ, κ, χ diventano palatali; σ davanti a β, γ, δ, μ, ν diventa sonora.`,rule:`γ /ɣ/→/ʝ/ · κ /k/→/c/ · χ /x/→/ç/ · σ /s/→/z/.`,exc:`Il tuo sistema non scrive queste differenze: γάλα = gàla e γέρος = gèros hanno la stessa g in trascrizione, ma suoni diversi.`,ex:['γάλα','γέρος','καλός','κεφάλι','χώρα','χέρι','σβήνω']},
{t:'Accento tonico e accenti grafici',sp:`Ogni parola con più sillabe ha una sillaba tonica, segnata con l’accento grafico sulla vocale. Nei digrafi l’accento va sulla seconda lettera.`,rule:`Nella trascrizione l’accento va sulla vocale della sillaba tonica: καφές = kafès.`,exc:`I monosillabi di norma non hanno accento (eccezioni: πού, πώς). Il maiuscolo senza accento non indica la sillaba tonica.`,ex:['καφές','πόρτα','άνθρωπος','ελληνικά']},
{t:'Dieresi e dittonghi spezzati',sp:`La dieresi (¨) su ι o υ indica che non formano digrafo con la vocale precedente.`,rule:`αϊ, οϊ, ϋ = vocali separate: ταΐζω = taìzo.`,exc:`Anche un accento sulla prima vocale spezza il digrafo: άι, όι.`,ex:['ταΐζω','προϊόν','μαϊμού','γάιδαρος']},
{t:'Differenza tra σ e ς',sp:`σ e ς sono la stessa lettera: ς si usa solo a fine parola.`,rule:`σ = ς = s. In maiuscolo si scrive sempre Σ.`,exc:`σ davanti a β, γ, δ, μ, ν si pronuncia /z/ (σβήνω, κόσμος); a fine parola ς resta /s/.`,ex:['σπίτι','κόσμος','νησί','ουρανός']},
{t:'Regole di lettura delle parole',sp:`Il metodo è sempre lo stesso, nell’ordine giusto.`,rule:`1) riconosci digrafi e nessi (αι, ου, μπ…) · 2) trascrivi le lettere singole · 3) applica il contesto (αυ/ευ, palatali) · 4) segna l’accento.`,exc:`Mai una sostituzione lettera per lettera: le combinazioni vanno riconosciute prima.`,ex:['πρωτεύουσα','αεροδρόμιο','ευχαριστώ','μπορώ']},
{t:'Come leggere parole mai viste',sp:`Il greco è molto regolare: la grafia indica quasi sempre la pronuncia.`,rule:`Digrafi e nessi → lettere singole → contesto → accento.`,exc:`Parole straniere e nomi propri possono avere pronunce irregolari.`,ex:['ηλεκτρονικός','μπουκάλι','γκρεμός','συγγραφέας']}];

const SIM=['<b>θ /θ/ e δ /ð/</b>: entrambe interdentali; θ sorda, δ sonora.','<b>χ /x/ e γ /ɣ/</b>: stesso punto, sorda e sonora; nessuna è la h italiana.','<b>κ /k/ e γκ /ɡ/</b>: sorda e sonora.','<b>π /p/ e μπ /b/</b>: sorda e sonora a inizio parola.'];
const S_ipa=()=>`<p class="mu">${_t('IPA fonemico semplificato (ι e υ davanti a vocale non sono scritte come semiconsonanti). L’audio legge una parola che contiene il suono, non il suono isolato.')}</p>`+[...new Set(IP.map(p=>p[1]))].map(c=>`<h3>${_t(c)}</h3>`+tbl(['IPA','Grafia','Descrizione','Esempio','Sistema'],IP.map((p,j)=>p[1]===c?`<tr${row(II[j])}><td><b>/${p[0]}/</b></td><td lang="el">${rt(p[2])}</td><td>${ipD(j)}</td><td>${p[4].slice(0,2).map(ex).join('')}</td><td><b>${p[5]}</b></td></tr>`:'').join(''))).join('')+`<h3>${_t('Suoni simili per un italofono')}</h3><ul>${[['θέμα','δέμα'],['χάνω','γάλα'],['καλός','γκαράζ'],['πάλι','μπάλα']].map((w,i)=>`<li>${_t(SIM[i])} ${w.map(ex).join('')}</li>`).join('')}</ul>`;
const S_les=()=>LES.map((l,j)=>{const o=lesO(j);return `<details><summary><b>${j+1}. ${o.t}</b></summary><p>${o.sp}</p><p><b>${_t('Regola')}:</b> ${o.rule}</p><p><b>${_t('Eccezioni e varianti:')}</b> ${o.exc}</p><p>${l.ex.map(ex).join('')}</p></details>`}).join('');
const S_acc=()=>`<p>${_t('Ogni parola con più sillabe ha una <b>sillaba tonica</b>, segnata con l’accento grafico (τόνος) sulla vocale. Nei digrafi l’accento sta sulla seconda lettera (αί, ού) e il digrafo resta un suono solo; se sta sulla prima (άι) le vocali si leggono separate. I monosillabi di norma non hanno accento (eccezioni: πού, πώς).')}</p><p>${_t('In greco l’accento è di intensità e le vocali atone non si riducono. Cambiare la sillaba tonica può cambiare il significato. Nella trascrizione dell’app l’accento si scrive sulla vocale tonica con questo segno: <b>{0}</b>.',AX)}</p><h3>${_t('Posizione dell’accento')}</h3><p>${[['καφές','ultima sillaba'],['πόρτα','penultima'],['άνθρωπος','terzultima']].map(a=>ex(a[0])+'<span class="mu">'+_t(a[1])+'</span> ').join('')}</p><h3>${_t('Cambia l’accento, cambia la parola')}</h3>`+tbl(['Parola','Significato','Parola','Significato'],PAIRS.map(p=>`<tr><td>${ex(p[0])}</td><td>${_t(p[1])}</td><td>${ex(p[2])}</td><td>${_t(p[3])}</td></tr>`).join(''))+`<h3>${_t('Monosillabi con accento')}</h3><p>${['πού','πώς'].map(ex).join('')}</p>`;
const S_err=()=>'<ol>'+errL().map(e=>`<li>${e}</li>`).join('')+'</ol>';
const S_qz=()=>`<label>${_t('Tipo di esercizio')}<select id="qt"><option value="mix">${_t('Misto')}</option><option value="snd">${_t('Riconosci il suono (ascolto)')}</option><option value="ipa">${_t('Lettera → IPA')}</option><option value="cmb">${_t('Combinazione → trascrizione')}</option><option value="read">${_t('Lettura di una parola')}</option><option value="acc">${_t('Sillaba accentata')}</option><option value="ear">${_t('Ascolto → trascrizione')}</option></select></label><div id="qq"></div><div id="qo" class="opts"></div><div id="qf"></div><div class="btns"><button id="qn" class="pri">${_t('Domanda')}</button></div><p id="qs" class="mu"></p>`;
const TABS=[['alf','Alfabeto',S_alf],['snd','Lettere e suoni',S_snd],['cmb','Combinazioni',S_cmb],['ipa','IPA',S_ipa],['les','Lezioni',S_les],['acc','Accento',S_acc],['err','Errori frequenti',S_err],['qz','Esercizi',S_qz]];
let FL='all';
function buildIm(){
 $('im').innerHTML=`<div class="imh"><h2>${_t('Impara · lettura e pronuncia del greco moderno')}</h2><button id="imx" class="pri">${_t('Chiudi')}</button></div>
 <div class="ctl">Audio <select id="rt" aria-label="${_t('Velocità')}"><option value="n">${_t('Normale')}</option><option value="s">${_t('Lenta')}</option></select> <button id="rep">${_t('Ripeti')}</button> <span id="vm" class="ko"></span></div>
 <input id="sq" type="search" placeholder="${_t('Cerca una lettera, un suono IPA, una combinazione o una parola…')}" aria-label="${_t('Cerca')}">
 <div class="chips" id="fl"><button data-f="w">${_t('Parole')}</button></div>
 <div id="sr" hidden></div><div id="tb"><div class="chips" id="sn">${TABS.map((t,i)=>`<button data-p="${t[0]}"${i?'':' class="on"'}>${_t(t[1])}</button>`).join('')}</div>${TABS.map((t,i)=>`<section id="p-${t[0]}"${i?' hidden':''}>${t[2]()}</section>`).join('')}</div>`;
 av();
}
function srch(){
 const q=nn($('sq').value.trim()),on=q||FL!=='all';
 $('sr').hidden=!on;$('tb').hidden=on;if(!on)return;
 const r=ENT.map((e,i)=>[e,i]).filter(([e])=>(FL==='all'||e.f===FL)&&(!q||e.blob.includes(q)));
 $('sr').innerHTML=r.length?`<p class="mu">${_t('{0} risultati',r.length)}${r.length>500?' '+_t('(primi 500)'):''}</p>`+r.slice(0,500).map(([e,i])=>`<div class="res"${row(i)}><b lang="el">${e.t}</b> <span class="mu">${_t(e.k)} · ${e.sub}</span></div>`).join(''):`<p class="mu">${_t('Nessun risultato.')}</p>`;
}
// ----- esercizi facoltativi (statistiche separate da quelle principali) -----
let QZ=null,QS={o:0,t:0};
const CF={dh:'d',th:'t',ch:'h',f:'v',v:'f',i:'e',u:'o',e:'i',o:'u',a:'e',s:'z',x:'ks'};
const shuf=a=>a.slice().sort(()=>Math.random()-.5);
const qopts=(c,p)=>{const o=[c];for(const x of shuf(p)){if(o.length>3)break;if(!o.includes(x))o.push(x)}return shuf(o)};
function wrongs(r){
 const T=r.T,vs=T.map((t,k)=>t.v?k:-1).filter(k=>k>=0),sj=T.findIndex(t=>t.s&&t.v),S=new Set();
 for(let n=0;n<40&&S.size<5;n++){
  const sh=sj>=0&&vs.length>1&&!rnd(3)?pick(vs):sj;
  const v=T.map((t,k)=>{let l=t.l;if(CF[l]&&!rnd(3))l=CF[l];return k===sh?l.replace(/[aeiou]/,m=>AC[m]):l}).join('');
  if(v!==r.a)S.add(v);
 }
 return[...S];
}
const wexp=w=>{const r=trs(w),rl=[...new Map(r.T.filter(t=>t.r).map(t=>[t.k,t])).values()];return `<b>${r.a}</b> · /${r.ipa}/<br>${r.T.map(t=>`${t.g}→${t.l}`).join(' · ')}`+(rl.length?'<ul>'+rl.map(t=>`<li>${rt(t.r)}</li>`).join('')+'</ul>':'')};
function mkq(ty){
 if(ty==='mix')ty=pick(['snd','ipa','cmb','read','acc','ear']);
 if((ty==='ear'||ty==='snd')&&!VO)ty='read';
 if(ty==='ipa'){const j=rnd(24),l=LET[j][0],c='/'+ipaL(l)+'/';
  return{h:_t('Quale suono ha la lettera {0}?',`<b class="big" lang="el">${upl(l)}</b>`),o:qopts(c,LET.map(x=>'/'+ipaL(x[0])+'/')),a:c,e:`${upl(l)} = ${c}; ${_t('Sistema').toLowerCase()}: <b>${SG[l]}</b>. ${ex(LET[j][2])}`};}
 if(ty==='cmb'){const cj=rnd(CMB.length),c=CMB[cj];
  return{h:_t('Come si trascrive {0} nel sistema?',`<b class="big" lang="el">${c[0]}</b>`),o:qopts(c[2],CMB.map(x=>x[2])),a:c[2],e:`${c[0]} = /${c[1]}/ → <b>${c[2]}</b>. ${cmbR(cj)}`};}
 if(ty==='snd'){const j=rnd(24),w=LET[j][2],r=trs(w),f=r.T[0].i;
  return{h:`${_t('Ascolta la parola: con quale suono inizia?')} ${au(w)}`,s:w,o:qopts('/'+f+'/',LET.map(x=>'/'+SI[x[0]]+'/').concat(['/ts/','/b/','/d/','/ɡ/'])),a:'/'+f+'/',e:`${ex(w)}<br>${_t('Inizia con {0} = /{1}/.',r.T[0].g,f)}`};}
 if(ty==='acc'){let w,r;do{w=pick(PW);r=trs(w)}while(r.T.filter(t=>t.v).length<3||!r.T.some(t=>t.s&&t.v));
  const vs=r.T.map((t,k)=>t.v?k:-1).filter(k=>k>=0),b=j=>r.T.map((t,k)=>k===j?t.l.replace(/[aeiou]/,m=>AC[m]):t.l).join('');
  return{h:`${_t('Quale trascrizione rispetta l’accento di {0}?',`<b class="big" lang="el">${w}</b>`)} ${au(w)}`,o:qopts(r.a,vs.map(b)),a:r.a,e:`${_t('L’accento grafico indica la sillaba tonica:')} ${wexp(w)}`};}
 const w=pick(PW),r=trs(w),o=qopts(r.a,wrongs(r));
 return ty==='ear'?{h:`${_t('Ascolta e scegli la trascrizione.')} ${au(w)}`,s:w,o,a:r.a,e:`<b lang="el">${w}</b><br>${wexp(w)}`}:{h:`${_t('Come si legge {0}?',`<b class="big" lang="el">${w}</b>`)} ${au(w)}`,o,a:r.a,e:wexp(w)};
}
function nq(){
 QZ=mkq($('qt').value);
 if(QZ.o.indexOf(QZ.a)<0)QZ.o[0]=QZ.a;
 $('qq').innerHTML=QZ.h;$('qf').innerHTML='';
 $('qo').innerHTML=QZ.o.map((o,i)=>`<button data-o="${i}">${o}</button>`).join('');
 if(QZ.s)say(QZ.s);
}
function ans(i){
 if(!QZ||QZ.d)return;QZ.d=1;QS.t++;const ok=QZ.o[i]===QZ.a;if(ok)QS.o++;
 [...$('qo').children].forEach((b,k)=>{b.disabled=true;if(QZ.o[k]===QZ.a)b.classList.add('good');else if(k===i)b.classList.add('bad')});
 $('qf').innerHTML=`<p><b class="${ok?'ok':'ko'}">${ok?_t('CORRETTO!'):_t('NON CORRETTO.')}</b></p><div>${QZ.e}</div>`;
 $('qs').textContent=_t('Esercizi Impara: {0} corrette su {1}',QS.o,QS.t);
}
// ----- schede e eventi (delegati: valgono anche per i contenuti generati) -----
document.addEventListener('click',e=>{
 const g=t=>e.target.closest(t);let b;
 if(b=g('[data-s]'))return say(b.dataset.s);
 if(b=g('[data-o]'))return ans(+b.dataset.o);
 if(b=g('[data-f]')){FL=FL===b.dataset.f?'all':b.dataset.f;[...$('fl').children].forEach(x=>x.classList.toggle('on',FL===x.dataset.f));return srch()} // “Parole” è un interruttore
 if(b=g('[data-p]')){[...$('sn').children].forEach(x=>x.classList.toggle('on',x===b));TABS.forEach(t=>$('p-'+t[0]).hidden=t[0]!==b.dataset.p);if(b.dataset.p==='qz'&&!QZ)nq();return}
 if(b=g('[data-e]')){$('cd').innerHTML=ENT[+b.dataset.e].html()+`<div class="btns"><button id="cdx" class="pri">${_t('Chiudi')}</button></div>`;$('cd').showModal();return}
 if(g('#cdx'))return $('cd').close();
 if(g('#imx'))return $('im').close();
 if(g('#rep'))return say(LAST);
 if(g('#qn'))return nq();
});

$('bi').onclick=()=>{if(!$('im').innerHTML)buildIm();av();clearTimeout(tmr);tOpen=Date.now();$('im').showModal()};
